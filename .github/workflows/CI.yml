name: "CI"
on:
  # Branches are tested through their pull request (the merge result);
  # main once more after each merge.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI and zips its build.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # git archive honours export-ignore in .gitattributes, so this holds
      # exactly what the release ZIP holds: no tests, tooling or CI files.
      - name: "Package what a release ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: syntax on 8.4 and 8.5, prefix,
  # PHPCompatibility, PHPStan and the WordPress.org Plugin Check on the build.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-broken-link-checker
      artifact: build-artifact
      prefixes: |
        avpvh_brkn
      # outdated_tested_upto_header and plugin_updater_detected: the plugin is
      # not on WordPress.org (Update URI points at GitHub).
      ignore-codes: |
        outdated_tested_upto_header
        plugin_updater_detected

  phpcs:
    name: "WordPress coding standards"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: cs2pr

      - name: "Install Composer dependencies"
        run: composer install -n --prefer-dist --no-progress

      - name: "PHPCS (WordPress security, API and PHP compatibility)"
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr --graceful-warnings

  # PHPUnit on 8.4 and 8.5, coverage to Codecov, SonarQube Cloud (when the
  # repo has SONAR_TOKEN): shared with the other own plugins.
  quality:
    name: "Quality"
    uses: grmt/wp-plugin-ci/.github/workflows/quality.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      sonar-exclusions: "languages/**"
